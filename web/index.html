<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LinkMeUp - Your permanent digital identity linked to one scan.">
  
  <!-- Open Graph / Social Media tags -->
  <meta property="og:title" content="LinkMeUp | Your Digital Identity">
  <meta property="og:description" content="One scan to link them all. View my verified social links on LinkMeUp.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/brand_logo_new.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LinkMeUp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LinkMeUp | Your Digital Identity</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      animation: fadeIn 0.8s ease-out;
    }
    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
    }
    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .app-name {
      color: #5B62F4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .tagline {
      color: #5B62F4;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: bold;
      margin-top: 24px;
      opacity: 0.6;
    }
    .loader {
      width: 18px;
      height: 18px;
      border: 2px solid #5B62F4;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
      margin-top: 24px;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="loading-container" class="loading">
    <div class="logo-container">
      <img src="assets/images/brand_logo_new.png" alt="LinkMeUp Logo" class="logo">
    </div>
    <div class="app-name">LinkMeUp</div>
    <div class="tagline">ONE QR. ALL YOUR LINKS.</div>
    <div class="loader"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    window.addEventListener('load', function(ev) {
      // The loader will be removed automatically by Flutter once it initializes
    });
  </script>
</body>
</html>
